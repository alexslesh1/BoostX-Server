[project]
name = "boostx-server"
version = "0.1.0"
description = "Backend API for the Nexora desktop client (PySide6 system monitor / booster / game launcher)."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.32.0,<0.33.0",
    "sqlalchemy[asyncio]>=2.0.35,<2.1.0",
    "alembic>=1.13.3,<1.14.0",
    "asyncpg>=0.30.0,<0.31.0",
    "pydantic>=2.9.2,<3.0.0",
    "pydantic-settings>=2.5.2,<3.0.0",
    "bcrypt>=4.2.0,<5.0.0",
    "cryptography>=43.0.0,<44.0.0",
    "pynacl>=1.5.0,<2.0.0",
    "pyjwt>=2.9.0,<3.0.0",
    "aiosmtplib>=3.0.2,<4.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "slowapi>=0.1.9,<0.2.0",
    "email-validator>=2.2.0,<3.0.0",
    "python-multipart>=0.0.12,<0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3,<9.0.0",
    "pytest-asyncio>=0.24.0,<0.25.0",
    "httpx>=0.27.2,<0.28.0",
    "aiosqlite>=0.20.0,<0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
